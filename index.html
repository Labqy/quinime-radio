<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icon.ico">
    <title>Quinime Radio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4b2b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff4b2b;
            --secondary: #ff416c;
            --bg: #121212;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #radio-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .join-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.4);
        }

        .player-container {
            text-align: center;
            width: 320px;
            padding: 25px;
            background: #1e1e1e;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            filter: blur(15px);
            transition: filter 0.5s ease;
        }

        #album-cover {
            width: 250px;
            height: 250px;
            background: #282828;
            margin: 0 auto 15px;
            border-radius: 15px;
            object-fit: cover;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .live-tag {
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .dot {
            height: 8px; width: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 75, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); }
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            cursor: default; 
        }

        #progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            transition: width 0.3s linear;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
            padding: 0 10px;
        }
        
        .controls-left {
            display: flex;
            align-items: center;
            gap: 10px; 
            flex: 1; 
            justify-content: flex-start; 
        }
        
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            width: 60px;
            height: 20px;
        }
        
        .controls-right {
            flex: 1; 
            display: flex;
            justify-content: flex-end; 
        }
        
        .controls-center {
            display: flex;
            justify-content: center;
        }
        
        .bar {
            width: 4px;
            height: 5px;
            background: var(--primary);
            border-radius: 2px;
            animation: bounce 1s ease-in-out infinite;
        }

        .bar:nth-child(2) { animation-duration: 0.8s; }
        .bar:nth-child(3) { animation-duration: 1.2s; }
        .bar:nth-child(4) { animation-duration: 0.9s; }
        .bar:nth-child(5) { animation-duration: 1.1s; }

        @keyframes bounce {
            0%, 100% { height: 5px; }
            50% { height: 15px; }
        }

        .paused .bar {
            animation-play-state: paused;
            height: 3px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .control-btn:hover { transform: scale(1.1); color: var(--primary); }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 80px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: #333;
            background-image: linear-gradient(var(--primary), var(--primary));
            background-size: 100% 100%;
            background-repeat: no-repeat;
            outline: none;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px; width: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .text-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            margin: 10px 0;
        }

        #title {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }

        #artist {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }        
        
        @media (max-width: 280px) {
            .player-container {
                width: 85%; 
                padding: 20px;
            }

            #album-cover {
                width: 65vw; 
                height: 65vw;
            }

            #title {
                font-size: 1.1rem;
            }

            #volume-slider {
                height: 10px; 
            }
            
            #volume-slider::-webkit-slider-thumb {
                height: 18px;
                width: 18px;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="radio-overlay">
        <div class="live-tag"><span class="dot"></span> QUINIME RADIO</div>
        <button id="join-btn" class="join-btn">LISTEN</button>
    </div>

    <div id="player-content" class="player-container">
        <div class="live-tag"><span class="dot"></span> QUINIME RADIO</div>
        
        <img src="" id="album-cover" alt="Cover Art" onerror="this.src='img/default.png';">

        <div class="text-container">
            <div id="title">Loading Title...</div>
        </div>
        <div id="artist">Loading Artist...</div>
        
        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <audio id="audio-player" preload="auto"></audio>
        <audio id="audio-buffer" preload="auto" style="display:none"></audio>

        <div class="controls">
            <div class="controls-left">
                <a id="external-link" href="#" target="_blank" class="control-btn" style="font-size: 1.2rem;">
                    <i class="fas fa-external-link-alt"></i>
                </a>
                <div class="visualizer-container paused">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="controls-center">
                <button id="play-pause-btn" class="control-btn">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
            </div>

            <div class="controls-right">
                <div class="volume-container">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const buffer = document.getElementById('audio-buffer');
        const titleLabel = document.getElementById('title');
        const artistLabel = document.getElementById('artist');
        const albumCover = document.getElementById('album-cover');
        const progress = document.getElementById('progress');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const visualizer = document.querySelector('.visualizer-container');
        
        const START_TIME = new Date('2025-01-01T00:00:00Z').getTime();
        let playlist = [];
        let expectedTime = 0;
        let isPreloaded = false;
        let currentSongIndex = -1;
        let songDelayTimeout = null;
        
        function shufflePlaylist(array) {
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            let seed = parseInt(today);
        
            for (let i = array.length - 1; i > 0; i--) {
                seed = (seed * 9301 + 49297) % 233280;
                const j = Math.floor((seed / 233280) * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        async function initRadio() {
            try {
                const response = await fetch('aset/lagu.json'); 
                const data = await response.json(); 
        
                playlist = data.filter(item => item.url && !isNaN(item.duration));
                playlist = shufflePlaylist(playlist);
                syncRadio();
            } catch (err) {
                console.error("Gagal memuat playlist:", err);
                titleLabel.innerText = "Error loading playlist.";
            }
        }
        
        function syncRadio() {
            if (playlist.length === 0) return;
            
            if (songDelayTimeout) clearTimeout(songDelayTimeout);
            audio.pause();
            isPreloaded = false;
            
            const totalDur = playlist.reduce((acc, s) => acc + s.duration, 0) * 1000;
            const timePassed = (Date.now() - START_TIME) % totalDur;
        
            let cumulative = 0;
            for (let i = 0; i < playlist.length; i++) {
                const songMs = playlist[i].duration * 1000;
                if (timePassed < cumulative + songMs) {
                    const seekPos = (timePassed - cumulative) / 1000;
                    expectedTime = seekPos; 
                    currentSongIndex = i;
                    startSong(playlist[i], seekPos);
                    break;
                }
                cumulative += songMs;
            }
        }
        
        function startSong(song, seek) {
            if (songDelayTimeout) clearTimeout(songDelayTimeout);
        
            audio.pause();
            playIcon.className = 'fas fa-spinner fa-spin';
            visualizer.classList.add('paused');
            titleLabel.innerText = "Buffering...";
            artistLabel.innerText = song.artist || "Unknown";
        
            audio.preload = "auto";
            audio.src = song.url;
            albumCover.src = song.cover || "img/default.png";
            audio.load();
            isPreloaded = false; 
        
            const externalLink = document.getElementById('external-link');
            if (song.link) {
                externalLink.href = song.link;
                externalLink.style.display = 'block';
            } else {
                externalLink.style.display = 'none'; 
            }
        
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: song.cover || "img/default.png", sizes: '512x512', type: 'image/png' }]
                });
            }
        
            audio.oncanplaythrough = function() {

                audio.oncanplaythrough = null;
        
                const actualSeek = seek + 3;
        
                songDelayTimeout = setTimeout(() => {
                    audio.currentTime = actualSeek;
                    expectedTime = actualSeek;
        
                    audio.play().then(() => {
                        titleLabel.innerText = song.title || "Unknown";
                        playIcon.className = 'fas fa-pause';
                        visualizer.classList.remove('paused');
                    }).catch(() => {
                        playIcon.className = 'fas fa-play';
                        visualizer.classList.add('paused');
                    });
                }, 1000); 
            };
        }
        
        audio.ontimeupdate = () => {
            expectedTime = audio.currentTime;
            progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
            
            const timeRemaining = audio.duration - audio.currentTime;
        
            if (timeRemaining < 15 && !isPreloaded && playlist.length > 0) {
                isPreloaded = true;
                const nextIdx = (currentSongIndex + 1) % playlist.length;
                const nextSong = playlist[nextIdx];
        
                buffer.src = nextSong.url;
                buffer.load();
        
                const imgPreload = new Image();
                imgPreload.src = nextSong.cover;
            }
        };
        
        audio.onseeking = function() {
            const delta = Math.abs(audio.currentTime - expectedTime);         
            if (delta > 2) {
                audio.currentTime = expectedTime;
            }
        };
        
        audio.onended = () => syncRadio();
        
        function togglePlayPause() {
            if (audio.paused) {
                syncRadio(); 
            } else {
                if (songDelayTimeout) clearTimeout(songDelayTimeout);
                audio.pause();
                playIcon.className = 'fas fa-play';
                visualizer.classList.add('paused');
            }
        }
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        
        volumeSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            audio.volume = v;
            buffer.volume = v;
            e.target.style.backgroundSize = (v * 100) + '% 100%';
        });
        
        document.getElementById('join-btn').addEventListener('click', () => {
            document.getElementById('radio-overlay').style.opacity = '0';
            document.getElementById('player-content').style.filter = 'blur(0)';
            setTimeout(() => {
                document.getElementById('radio-overlay').style.display = 'none';
                audio.volume = 0.5; 
                buffer.volume = 0.5;
        
                initRadio();
                volumeSlider.dispatchEvent(new Event('input'));
            }, 500);
        });
        
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePlayPause);
            navigator.mediaSession.setActionHandler('pause', togglePlayPause);
            navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime = expectedTime; });
            navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime = expectedTime; });
            navigator.mediaSession.setActionHandler('seekto', () => { audio.currentTime = expectedTime; });
        }
        
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
              .then(() => console.log('PWA Service Worker Aktif!'))
              .catch((err) => console.log('Gagal daftar SW:', err));
          });
        }        
    </script>
</body>
</html>
